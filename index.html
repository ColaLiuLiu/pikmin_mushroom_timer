<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮克敏蘑菇戰鬥計時器</title>
<style>
  :root {
    --green: #7cb342;
    --green-dark: #558b2f;
    --green-pale: #e6f4d7;
    --skin: #fdf1e6;
    --skin-light: #fffdfb;
    --bg: var(--skin);
    --card-bg: var(--skin-light);
    --text: #3c3126;
    --muted: #8a7a68;
    --border: #f0dcc4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(180deg, var(--skin-light) 0%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 10px 16px 76px;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    text-align: center;
    font-size: 1.15rem;
    margin: 0 0 2px;
    color: var(--green-dark);
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-bottom: 8px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .card h2 {
    font-size: 0.9rem;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.red { background: var(--green-dark); }
  .dot.blue { background: var(--green); }
  .dot.yellow { background: var(--green-dark); }
  .dot.purple { background: var(--green); }

  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field {
    flex: 1;
    min-width: 110px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .duration-grid .field {
    min-width: 0;
  }

  label {
    font-size: 0.72rem;
    color: var(--muted);
  }

  input[type="date"],
  input[type="time"],
  input.num {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    width: 100%;
    min-width: 0;
    background: #fffdf7;
    color: var(--text);
  }

  input.num {
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  #noteInput,
  #editNoteInput {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fffdf7;
    color: var(--text);
  }

  input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(124,179,66,0.18);
  }

  .duration-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .time-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .now-btn {
    margin-top: 6px;
    width: 100%;
    padding: 7px;
    border: 1px solid var(--green);
    background: transparent;
    color: var(--green-dark);
    border-radius: 8px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .now-btn:hover { background: var(--green-pale); }

  .quick-input-panel {
    background: var(--green-pale);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quick-input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .quick-tag {
    padding: 5px 10px;
    border: 1px solid var(--green);
    background: #fff;
    color: var(--green-dark);
    border-radius: 999px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }
  .quick-tag:hover {
    background: var(--green);
    color: #fff;
  }

  .quick-tag.tag-gray { border-color: #6b6b6b; color: #4a4a4a; }
  .quick-tag.tag-gray:hover { background: #6b6b6b; color: #fff; }

  .quick-tag.tag-red { border-color: #e63946; color: #c1121f; }
  .quick-tag.tag-red:hover { background: #e63946; color: #fff; }

  .quick-tag.tag-yellow { border-color: #d4a300; color: #a67c00; }
  .quick-tag.tag-yellow:hover { background: #d4a300; color: #fff; }

  .quick-tag.tag-blue { border-color: #457b9d; color: #2f5f7a; }
  .quick-tag.tag-blue:hover { background: #457b9d; color: #fff; }

  .quick-tag.tag-pink { border-color: #e685a8; color: #c85a86; }
  .quick-tag.tag-pink:hover { background: #e685a8; color: #fff; }

  .quick-tag.tag-purple { border-color: #8e5fb0; color: #6f3f96; }
  .quick-tag.tag-purple:hover { background: #8e5fb0; color: #fff; }

  .quick-tag.tag-cyan { border-color: #3ec6e0; color: #1a95ac; }
  .quick-tag.tag-cyan:hover { background: #3ec6e0; color: #fff; }

  .quick-tag.tag-clear { border-color: #b5453c; color: #b5453c; }
  .quick-tag.tag-clear:hover { background: #b5453c; color: #fff; }

  .quick-tag.tag-bold { font-weight: 700; }

  .quick-tag.tag-skin { border-color: #c98a54; color: #a8683a; }
  .quick-tag.tag-skin:hover { background: #c98a54; color: #fff; }

  .quick-tag.tag-bright-green { border-color: #4caf50; color: #2e9c32; }
  .quick-tag.tag-bright-green:hover { background: #4caf50; color: #fff; }

  #noteCustomTagsSlot {
    display: contents;
  }

  .edit-tags-btn {
    padding: 5px 10px;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }
  .edit-tags-btn:hover {
    background: var(--green-pale);
    color: var(--green-dark);
    border-color: var(--green);
  }

  .custom-tags-editor {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .custom-tag-input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.8rem;
    background: #fffdf7;
    color: var(--text);
  }
  .custom-tag-input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(124,179,66,0.18);
  }

  .danger-btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: #d9534f;
    color: #fff;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .danger-btn:hover { background: #c9433f; }

  .success-btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: var(--green);
    color: #fff;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .success-btn:hover { background: var(--green-dark); }

  .record-actions {
    display: flex;
    gap: 8px;
  }
  .record-actions .success-btn,
  .record-actions .danger-btn {
    width: auto;
    flex: 1;
    margin-top: 0;
    padding: 12px;
  }

  .result-card {
    background: linear-gradient(135deg, #a5d16a 0%, var(--green-dark) 100%);
    color: #fff;
    text-align: center;
    padding: 10px 12px;
  }

  .result-card .label {
    font-size: 0.95rem;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 2px;
  }

  .result-card .end-datetime {
    display: flex;
    justify-content: center;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.3;
    word-break: keep-all;
  }

  .result-card .end-datetime small {
    font-size: 1rem;
    font-weight: 700;
    opacity: 0.9;
  }

  #sortByEndTimeBtn {
    padding: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  #notifyRecordsBtn {
    width: 100%;
    margin-bottom: 4px;
    padding: 10px;
    border: 1px solid var(--green);
    background: transparent;
    color: var(--green-dark);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  #notifyRecordsBtn:hover {
    background: var(--green-pale);
  }
  #notifyRecordsBtn.active {
    border: none;
    background: var(--green);
    color: #fff;
  }
  #notifyRecordsBtn.active:hover {
    background: var(--green-dark);
  }

  .records-notify-hint {
    text-align: center;
    font-size: 0.7rem;
    line-height: 1.3;
    color: var(--muted);
    margin-bottom: 8px;
    height: 2.6em;
    overflow: hidden;
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .filter-toggle-btn {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .filter-toggle-btn:hover,
  .filter-toggle-btn.active {
    background: var(--green-pale);
    color: var(--green-dark);
    border-color: var(--green);
  }

  .filter-input {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.85rem;
    background: #fffdf7;
    color: var(--text);
  }
  .filter-input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(124,179,66,0.18);
  }

  .empty-hint {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 8px 0;
  }

  .record-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .record-row:last-child {
    border-bottom: none;
  }

  .record-index {
    flex: 0 0 auto;
    min-width: 28px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--green-dark);
  }

  .record-info {
    flex: 1;
    min-width: 0;
  }

  .record-time {
    font-size: 0.85rem;
    font-weight: 600;
  }

  .record-text {
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-word;
  }

  .record-delete {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .record-delete:hover {
    background: var(--green-pale);
    color: var(--green-dark);
    border-color: var(--green);
  }

  .record-move {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    gap: 4px;
  }

  .move-btn {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    font-size: 0.6rem;
    line-height: 1;
    cursor: pointer;
  }
  .move-btn:hover:not(:disabled) {
    background: var(--green-pale);
    color: var(--green-dark);
    border-color: var(--green);
  }
  .move-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .edit-note-btn {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }
  .edit-note-btn:hover {
    background: var(--green-pale);
    color: var(--green-dark);
    border-color: var(--green);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal-card {
    width: min(98vw, 560px);
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  .modal-title {
    margin: 0 0 10px;
    font-size: 1rem;
    color: var(--green-dark);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .modal-actions button {
    flex: 1;
    width: auto;
    margin-top: 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 4px;
  }

  [hidden] {
    display: none !important;
  }

  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 10;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }

  .tab-btn.active {
    color: var(--green-dark);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🍄 皮克敏蘑菇戰鬥計時器</h1>
  <div class="subtitle">輸入目前日期時間與剩餘時間，即時算出戰鬥結束時刻</div>

  <div id="tab-timer">
  <div class="card">
    <h2><span class="dot blue"></span>目前日期與時間</h2>
    <div class="row">
      <div class="field">
        <label for="currentDate">目前日期</label>
        <input type="date" id="currentDate">
      </div>
      <div class="field">
        <label>目前時間（24小時制）</label>
        <div class="duration-grid time-grid">
          <div class="field">
            <label for="currentHour">時</label>
            <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="currentHour" value="0" maxlength="2">
          </div>
          <div class="field">
            <label for="currentMinute">分</label>
            <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="currentMinute" value="0" maxlength="2">
          </div>
          <div class="field">
            <label for="currentSecond">秒</label>
            <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="currentSecond" value="0" maxlength="2">
          </div>
        </div>
      </div>
    </div>
    <button class="now-btn" id="nowBtn">使用現在的日期與時間</button>
  </div>

  <div class="card">
    <h2><span class="dot red"></span>蘑菇剩餘時間</h2>
    <div class="duration-grid">
      <div class="field">
        <label for="days">日</label>
        <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="days" placeholder="0" maxlength="4">
      </div>
      <div class="field">
        <label for="hours">時</label>
        <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="hours" placeholder="0" maxlength="2">
      </div>
      <div class="field">
        <label for="minutes">分</label>
        <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="minutes" placeholder="0" maxlength="2">
      </div>
      <div class="field">
        <label for="seconds">秒</label>
        <input class="num" type="text" inputmode="numeric" pattern="[0-9]*" id="seconds" placeholder="0" maxlength="2">
      </div>
    </div>
  </div>

  <div class="card result-card">
    <div class="label">蘑菇結束時間</div>
    <div class="end-datetime" id="result">請輸入日期與時間</div>
  </div>

  <div class="card">
    <h2><span class="dot blue"></span>備註並儲存</h2>
    <div class="field">
      <input type="text" id="noteInput" placeholder="備註文字，例如：大白 / 日本大美菇">
    </div>
    <button class="now-btn" id="quickInputToggleBtn">📌 快速輸入關鍵字</button>
    <div class="quick-input-panel" id="quickInputPanel" hidden>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-bold" data-text="巨">巨</button>
        <button type="button" class="quick-tag tag-bold" data-text="大">大</button>
        <button type="button" class="quick-tag" data-text="一般">一般</button>
        <button type="button" class="quick-tag" data-text="小">小</button>
      </div>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-bold" data-text="活動">活動</button>
        <button type="button" class="quick-tag tag-gray" data-text="水晶">水晶</button>
        <button type="button" class="quick-tag tag-gray" data-text="毒">毒</button>
        <button type="button" class="quick-tag tag-red" data-text="火">火</button>
        <button type="button" class="quick-tag tag-yellow" data-text="電">電</button>
        <button type="button" class="quick-tag tag-blue" data-text="水">水</button>
      </div>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-gray" data-text="白">白</button>
        <button type="button" class="quick-tag tag-gray" data-text="灰">灰</button>
        <button type="button" class="quick-tag tag-pink" data-text="粉紅">粉</button>
        <button type="button" class="quick-tag tag-red" data-text="紅">紅</button>
        <button type="button" class="quick-tag tag-yellow" data-text="黃">黃</button>
        <button type="button" class="quick-tag tag-blue" data-text="藍">藍</button>
        <button type="button" class="quick-tag tag-purple" data-text="紫">紫</button>
        <button type="button" class="quick-tag tag-cyan" data-text="冰藍">冰</button>
      </div>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-skin" data-text="菇">菇</button>
        <button type="button" class="quick-tag tag-bright-green" data-text="花">花</button>
        <button type="button" class="quick-tag" data-text=" ">空白鍵</button>
        <button type="button" class="quick-tag" data-text="-">減號</button>
        <button type="button" class="quick-tag tag-clear" data-action="clear">清除</button>
      </div>
      <div class="quick-input-row">
        <span id="noteCustomTagsSlot"></span>
        <button type="button" class="edit-tags-btn" id="editCustomTagsBtn">⚙️ 自訂關鍵字</button>
      </div>
      <div class="custom-tags-editor" id="customTagsEditor" hidden>
        <input type="text" class="custom-tag-input" data-slot="0" maxlength="5" placeholder="自訂關鍵字 1">
        <input type="text" class="custom-tag-input" data-slot="1" maxlength="5" placeholder="自訂關鍵字 2">
        <input type="text" class="custom-tag-input" data-slot="2" maxlength="5" placeholder="自訂關鍵字 3">
        <input type="text" class="custom-tag-input" data-slot="3" maxlength="5" placeholder="自訂關鍵字 4">
        <input type="text" class="custom-tag-input" data-slot="4" maxlength="5" placeholder="自訂關鍵字 5">
        <button type="button" class="now-btn" id="saveCustomTagsBtn">儲存自訂關鍵字</button>
      </div>
    </div>
    <button class="now-btn" id="saveBtn">儲存結束時間與備註</button>
  </div>
  </div>

  <div id="tab-records" hidden>
  <div class="card">
    <h2><span class="dot red"></span>已儲存記錄</h2>
    <div class="filter-row">
      <button class="filter-toggle-btn" id="filterToggleBtn" title="篩選備註">🔍</button>
      <input type="text" id="filterInput" class="filter-input" placeholder="輸入文字篩選備註" hidden>
      <button class="filter-toggle-btn" id="filterQuickToggleBtn" title="快速輸入" hidden>📌</button>
    </div>
    <div class="quick-input-panel" id="filterQuickPanel" hidden>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-bold" data-text="巨">巨</button>
        <button type="button" class="quick-tag tag-bold" data-text="大">大</button>
        <button type="button" class="quick-tag" data-text="一般">一般</button>
        <button type="button" class="quick-tag" data-text="小">小</button>
      </div>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-bold" data-text="活動">活動</button>
        <button type="button" class="quick-tag tag-gray" data-text="水晶">水晶</button>
        <button type="button" class="quick-tag tag-gray" data-text="毒">毒</button>
        <button type="button" class="quick-tag tag-red" data-text="火">火</button>

<div class="modal-overlay" id="editNoteOverlay" hidden>

    <button class="now-btn" id="editQuickToggleBtn">📌 快速輸入關鍵字</button>
    <div class="quick-input-panel" id="editQuickPanel" hidden>

        <button type="button" class="quick-tag tag-yellow" data-text="電">電</button>
        <button type="button" class="quick-tag tag-blue" data-text="水">水</button>
      </div>
      <div class="quick-input-row">
        <button type="button" class="quick-tag tag-gray" data-text="白">白</button>
        <button type="button" class="quick-tag tag-gray" data-text="灰">灰</button>
        <button type="button" class="quick-tag tag-pink" data-text="粉紅">粉</button>
        <button type="button" class="quick-tag tag-red" data-text="紅">紅</button>
        <button type="button" class="quick-tag tag-yellow" data-text="黃">黃</button>
        <button type="button" class="quick-tag tag-blue" data-text="藍">藍</button>
        <button type="button" class="quick-tag tag-purple" data-text="紫">紫</button>

<script>
  const dateInput = document.getElementById('currentDate');
  const currentHourInput = document.getElementById('currentHour');
  const currentMinuteInput = document.getElementById('currentMinute');
  const currentSecondInput = document.getElementById('currentSecond');
  const daysInput = document.getElementById('days');
  const hoursInput = document.getElementById('hours');
  const minutesInput = document.getElementById('minutes');
  const secondsInput = document.getElementById('seconds');
  const resultEl = document.getElementById('result');
  const nowBtn = document.getElementById('nowBtn');
  const noteInput = document.getElementById('noteInput');
  const quickInputToggleBtn = document.getElementById('quickInputToggleBtn');
  const quickInputPanel = document.getElementById('quickInputPanel');
  const noteCustomTagsSlot = document.getElementById('noteCustomTagsSlot');
  const filterCustomTagsSlot = document.getElementById('filterCustomTagsSlot');
  const editCustomTagsBtn = document.getElementById('editCustomTagsBtn');
  const customTagsEditor = document.getElementById('customTagsEditor');
  const saveCustomTagsBtn = document.getElementById('saveCustomTagsBtn');
  const saveBtn = document.getElementById('saveBtn');
  const savedListEl = document.getElementById('savedList');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const exportBtn = document.getElementById('exportBtn');
  const sortByEndTimeBtn = document.getElementById('sortByEndTimeBtn');
  const filterToggleBtn = document.getElementById('filterToggleBtn');
  const filterInput = document.getElementById('filterInput');
  const filterQuickToggleBtn = document.getElementById('filterQuickToggleBtn');
  const filterQuickPanel = document.getElementById('filterQuickPanel');
  const notifyRecordsBtn = document.getElementById('notifyRecordsBtn');
  const notifyRecordsHint = document.getElementById('notifyRecordsHint');
  const editNoteOverlay = document.getElementById('editNoteOverlay');
  const editNoteInput = document.getElementById('editNoteInput');
  const editQuickToggleBtn = document.getElementById('editQuickToggleBtn');
  const editQuickPanel = document.getElementById('editQuickPanel');
  const editCustomTagsSlot = document.getElementById('editCustomTagsSlot');
  const editNoteCancelBtn = document.getElementById('editNoteCancelBtn');
  const editNoteSaveBtn = document.getElementById('editNoteSaveBtn');

  const STORAGE_KEY = 'pikminMushroomRecords';
  const NOTIFY_ENABLED_KEY = 'pikminNotifyRecordsEnabled';
  const CUSTOM_TAGS_KEY = 'pikminCustomTags';
  const CUSTOM_TAGS_MAX = 5;
  const CUSTOM_TAG_MAX_LENGTH = 5;
  let currentEndDate = null;

  const numInputs = [
    currentHourInput, currentMinuteInput, currentSecondInput,
    daysInput, hoursInput, minutesInput, secondsInput,
  ];

  function sanitizeNumeric(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
  }

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function setToNow() {
    const now = new Date();
    dateInput.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    currentHourInput.value = now.getHours();
    currentMinuteInput.value = now.getMinutes();
    currentSecondInput.value = now.getSeconds();
    updateResult();
  }

  const weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];

  function formatDateTime(d) {
    const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${weekdayNames[d.getDay()]})`;
    const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    return { dateStr, timeStr };
  }

  function updateResult() {
    if (!dateInput.value) {
      currentEndDate = null;
      resultEl.textContent = '請輸入日期與時間';
      return;
    }

    const currentHour = parseInt(currentHourInput.value, 10) || 0;
    const currentMinute = parseInt(currentMinuteInput.value, 10) || 0;
    const currentSecond = parseInt(currentSecondInput.value, 10) || 0;
    const timeString = `${pad(currentHour)}:${pad(currentMinute)}:${pad(currentSecond)}`;
    const start = new Date(`${dateInput.value}T${timeString}`);

    if (isNaN(start.getTime())) {
      currentEndDate = null;
      resultEl.textContent = '日期時間格式錯誤';
      return;
    }

    const days = parseInt(daysInput.value, 10) || 0;
    const hours = parseInt(hoursInput.value, 10) || 0;
    const minutes = parseInt(minutesInput.value, 10) || 0;
    const seconds = parseInt(secondsInput.value, 10) || 0;

    const totalMs = (((days * 24 + hours) * 60 + minutes) * 60 + seconds) * 1000;
    const end = new Date(start.getTime() + totalMs);
    currentEndDate = end;

    const { dateStr, timeStr } = formatDateTime(end);
    resultEl.innerHTML = `${dateStr}<small>${timeStr}</small>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function loadCustomTags() {
    let arr;
    try {
      arr = JSON.parse(localStorage.getItem(CUSTOM_TAGS_KEY));
    } catch (e) {
      arr = null;
    }
    if (!Array.isArray(arr)) arr = [];
    const slots = [];
    for (let i = 0; i < CUSTOM_TAGS_MAX; i++) {
      slots.push(typeof arr[i] === 'string' ? arr[i].slice(0, CUSTOM_TAG_MAX_LENGTH) : '');
    }
    return slots;
  }

  function saveCustomTags(slots) {
    localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(slots.slice(0, CUSTOM_TAGS_MAX)));
  }

  function renderCustomTagButtons() {
    const tagsHtml = loadCustomTags()
      .filter((tag) => tag.trim() !== '')
      .map((tag) => `<button type="button" class="quick-tag" data-text="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`)
      .join('');
    noteCustomTagsSlot.innerHTML = tagsHtml;
    filterCustomTagsSlot.innerHTML = tagsHtml;
    editCustomTagsSlot.innerHTML = tagsHtml;
  }

  function loadRecords() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(raw) ? raw : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function renderRecords() {
    const records = loadRecords();
    clearAllBtn.hidden = records.length === 0;
    exportBtn.hidden = records.length === 0;

    if (records.length === 0) {
      savedListEl.innerHTML = '<div class="empty-hint">尚無儲存的記錄</div>';
      return;
    }

    const filterText = filterInput.value.trim().toLowerCase();
    const visibleIndices = records
      .map((record, index) => index)
      .filter((index) => !filterText || (records[index].text || '').toLowerCase().includes(filterText));

    if (visibleIndices.length === 0) {
      savedListEl.innerHTML = '<div class="empty-hint">沒有符合篩選條件的記錄</div>';
      return;
    }

    savedListEl.innerHTML = visibleIndices.map((index, displayPos) => {
      const record = records[index];
      const { dateStr, timeStr } = formatDateTime(new Date(record.endTime));
      const noteHtml = record.text
        ? escapeHtml(record.text)
        : '';
      return `
        <div class="record-row">
          <div class="record-move">
            <button class="move-btn" data-index="${index}" data-dir="-1" title="上移" ${index === 0 ? 'disabled' : ''}>▲</button>
            <button class="move-btn" data-index="${index}" data-dir="1" title="下移" ${index === records.length - 1 ? 'disabled' : ''}>▼</button>
          </div>
          <span class="record-index">#${displayPos + 1}</span>
          <div class="record-info">
            <div class="record-time">${dateStr} ${timeStr}</div>
            <div class="record-text">${noteHtml}</div>
          </div>
          <button class="edit-note-btn" data-index="${index}" title="編輯備註">✐</button>
          <button class="record-delete" data-index="${index}" title="刪除">×</button>
        </div>
      `;
    }).join('');
  }

  function saveCurrentResult() {
    if (!currentEndDate) return;
    const records = loadRecords();
    records.push({
      endTime: currentEndDate.toISOString(),
      text: noteInput.value.trim(),
    });
    saveRecords(records);
    noteInput.value = '';
    renderRecords();
  }

  numInputs.forEach((input) => {
    input.addEventListener('input', () => {
      sanitizeNumeric(input);
      updateResult();
    });
  });

  dateInput.addEventListener('input', updateResult);
  nowBtn.addEventListener('click', setToNow);
  saveBtn.addEventListener('click', saveCurrentResult);

  quickInputToggleBtn.addEventListener('click', () => {
    quickInputPanel.hidden = !quickInputPanel.hidden;
  });

  editCustomTagsBtn.addEventListener('click', () => {
    if (customTagsEditor.hidden) {
      const slots = loadCustomTags();
      customTagsEditor.querySelectorAll('.custom-tag-input').forEach((input) => {
        input.value = slots[parseInt(input.dataset.slot, 10)];
      });
    }
    customTagsEditor.hidden = !customTagsEditor.hidden;
  });

  saveCustomTagsBtn.addEventListener('click', () => {
    const slots = [];
    customTagsEditor.querySelectorAll('.custom-tag-input').forEach((input) => {
      slots[parseInt(input.dataset.slot, 10)] = input.value.trim().slice(0, CUSTOM_TAG_MAX_LENGTH);
    });
    saveCustomTags(slots);
    renderCustomTagButtons();
    customTagsEditor.hidden = true;
  });

  renderCustomTagButtons();

  function insertAtCursor(input, text) {
    if (document.activeElement !== input) {
      input.value += text;
      return;
    }
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0, start) + text + input.value.slice(end);
    const cursorPos = start + text.length;
    input.setSelectionRange(cursorPos, cursorPos);
  }

  quickInputPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('.quick-tag');
    if (!btn) return;
    if (btn.dataset.action === 'clear') {
      noteInput.value = '';
      return;
    }
    insertAtCursor(noteInput, btn.dataset.text);
  });

  filterToggleBtn.addEventListener('click', () => {
    const isShowing = !filterInput.hidden;
    if (isShowing) {
      filterInput.hidden = true;
      filterToggleBtn.classList.remove('active');
      filterQuickToggleBtn.hidden = true;
      filterQuickToggleBtn.classList.remove('active');
      filterQuickPanel.hidden = true;
      if (filterInput.value) {
        filterInput.value = '';
        renderRecords();
      }
    } else {
      filterInput.hidden = false;
      filterToggleBtn.classList.add('active');
      filterQuickToggleBtn.hidden = false;
      filterInput.focus();
    }
  });

  filterInput.addEventListener('input', renderRecords);

  filterQuickToggleBtn.addEventListener('click', () => {
    filterQuickPanel.hidden = !filterQuickPanel.hidden;
    filterQuickToggleBtn.classList.toggle('active', !filterQuickPanel.hidden);
  });

  filterQuickPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('.quick-tag');
    if (!btn) return;
    if (btn.dataset.action === 'clear') {
      filterInput.value = '';
    } else {
      insertAtCursor(filterInput, btn.dataset.text);
    }
    renderRecords();
  });

  function moveRecord(index, dir) {
    const records = loadRecords();
    const newIndex = index + dir;
    if (newIndex < 0 || newIndex >= records.length) return;
    [records[index], records[newIndex]] = [records[newIndex], records[index]];
    saveRecords(records);
    renderRecords();
  }

  savedListEl.addEventListener('click', (e) => {
    const moveBtn = e.target.closest('.move-btn');
    if (moveBtn) {
      moveRecord(parseInt(moveBtn.dataset.index, 10), parseInt(moveBtn.dataset.dir, 10));
      return;
    }

    const editBtn = e.target.closest('.edit-note-btn');
    if (editBtn) {
      openEditNoteModal(parseInt(editBtn.dataset.index, 10));
      return;
    }

    const btn = e.target.closest('.record-delete');
    if (!btn) return;
    const index = parseInt(btn.dataset.index, 10);
    const records = loadRecords();
    records.splice(index, 1);
    saveRecords(records);
    renderRecords();
  });

  let editingRecordIndex = null;

  function openEditNoteModal(index) {
    const records = loadRecords();
    const record = records[index];
    if (!record) return;
    editingRecordIndex = index;
    editNoteInput.value = record.text || '';
    editQuickPanel.hidden = false;
    editNoteOverlay.hidden = false;
  }

  function closeEditNoteModal() {
    editNoteOverlay.hidden = true;
    editingRecordIndex = null;
  }

  editNoteCancelBtn.addEventListener('click', closeEditNoteModal);

  editNoteOverlay.addEventListener('click', (e) => {
    if (e.target === editNoteOverlay) closeEditNoteModal();
  });

  editNoteSaveBtn.addEventListener('click', () => {
    if (editingRecordIndex === null) return;
    const records = loadRecords();
    if (records[editingRecordIndex]) {
      records[editingRecordIndex].text = editNoteInput.value.trim();
      saveRecords(records);
      renderRecords();
    }
    closeEditNoteModal();
  });

  editQuickToggleBtn.addEventListener('click', () => {
    editQuickPanel.hidden = !editQuickPanel.hidden;
  });

  editQuickPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('.quick-tag');
    if (!btn) return;
    if (btn.dataset.action === 'clear') {
      editNoteInput.value = '';
      return;
    }
    insertAtCursor(editNoteInput, btn.dataset.text);
  });

  sortByEndTimeBtn.addEventListener('click', () => {
    const records = loadRecords();
    records.sort((a, b) => new Date(a.endTime).getTime() - new Date(b.endTime).getTime());
    saveRecords(records);
    renderRecords();
  });

  clearAllBtn.addEventListener('click', () => {
    if (!confirm('確定要刪除全部的記錄嗎？此動作無法復原！')) return;
    saveRecords([]);
    renderRecords();
  });

  function csvEscape(value) {
    const str = String(value);
    if (/[",\r\n]/.test(str)) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  }

  function exportCsv() {
    const records = loadRecords();
    if (records.length === 0) return;

    const rows = [['序號', '備註', '剩餘時間']];
    records.forEach((record, index) => {
      const { dateStr, timeStr } = formatDateTime(new Date(record.endTime));
      rows.push([index + 1, record.text || '', `${dateStr} ${timeStr}`]);
    });

    const BOM = String.fromCharCode(0xFEFF);
    const csvContent = BOM + rows.map((row) => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const fileDate = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;

    const a = document.createElement('a');
    a.href = url;
    a.download = `蘑菇計時器記錄_${fileDate}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener('click', exportCsv);

  function isNotifyEnabled() {
    return localStorage.getItem(NOTIFY_ENABLED_KEY) === '1';
  }

  function setNotifyEnabled(enabled) {
    localStorage.setItem(NOTIFY_ENABLED_KEY, enabled ? '1' : '0');
  }

  function updateNotifyRecordsUI() {
    const enabled = isNotifyEnabled();
    notifyRecordsBtn.classList.toggle('active', enabled);
    notifyRecordsBtn.textContent = enabled ? '🔔 通知已開啟' : '🔔 開啟通知';

    if (!('Notification' in window)) {
      notifyRecordsHint.textContent = '此瀏覽器不支援通知功能';
    } else if (Notification.permission === 'denied') {
      notifyRecordsHint.textContent = '通知權限已被封鎖，請至瀏覽器設定開啟';
    } else if (enabled) {
      notifyRecordsHint.textContent = '請保持此分頁開啟，記錄的結束時間到會跳出通知';
    } else {
      notifyRecordsHint.textContent = ' ';
    }
  }

  async function enableRecordNotifications() {
    if (!('Notification' in window)) {
      alert('此瀏覽器不支援通知功能');
      return;
    }

    if (Notification.permission === 'default') {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        updateNotifyRecordsUI();
        return;
      }
    } else if (Notification.permission === 'denied') {
      updateNotifyRecordsUI();
      return;
    }

    const records = loadRecords();
    const now = Date.now();
    let changed = false;
    records.forEach((record) => {
      if (!record.notified && new Date(record.endTime).getTime() <= now) {
        record.notified = true;
        changed = true;
      }
    });
    if (changed) saveRecords(records);

    setNotifyEnabled(true);
    updateNotifyRecordsUI();
  }

  notifyRecordsBtn.addEventListener('click', () => {
    if (isNotifyEnabled()) {
      setNotifyEnabled(false);
      updateNotifyRecordsUI();
    } else {
      enableRecordNotifications();
    }
  });

  setInterval(() => {
    if (!isNotifyEnabled()) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;

    const records = loadRecords();
    const now = Date.now();
    let changed = false;
    records.forEach((record) => {
      if (record.notified) return;
      if (new Date(record.endTime).getTime() > now) return;
      record.notified = true;
      changed = true;
      new Notification('🍄 蘑菇戰鬥結算時間到了！', {
        body: record.text ? `備註：${record.text}` : '有一筆儲存的蘑菇計時已結束。',
      });
    });
    if (changed) saveRecords(records);
  }, 1000);

  updateNotifyRecordsUI();

  const tabTimerPanel = document.getElementById('tab-timer');
  const tabRecordsPanel = document.getElementById('tab-records');
  const tabBtnTimer = document.getElementById('tabBtnTimer');
  const tabBtnRecords = document.getElementById('tabBtnRecords');

  function switchTab(tab) {
    const isTimer = tab === 'timer';
    tabTimerPanel.hidden = !isTimer;
    tabRecordsPanel.hidden = isTimer;
    tabBtnTimer.classList.toggle('active', isTimer);
    tabBtnRecords.classList.toggle('active', !isTimer);
  }

  tabBtnTimer.addEventListener('click', () => switchTab('timer'));
  tabBtnRecords.addEventListener('click', () => switchTab('records'));

  setToNow();
  renderRecords();
</script>
</body>
